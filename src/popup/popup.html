<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Electrician Qualification Checker</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="brand">
    <div id="brand-art"><span class="brand-name">Elec Training</span><small>Development branding placeholder</small></div>
    <span class="edition">QUALIFICATION CHECKER</span>
  </header>
  <main>
    <h1>UK Electrician<br>Qualification Checker</h1>
    <p id="intro" class="muted"></p>
    <p id="review-notice" class="notice" hidden></p>
    <section id="starting-point" aria-labelledby="question">
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
    </section>
    <section id="result" aria-labelledby="result-heading" hidden>
      <p class="eyebrow">YOUR STARTING POINT</p>
      <p id="selected-label" class="selected"></p>
      <h2 id="result-heading" tabindex="-1"></h2>
      <p id="result-intro"></p>
      <ol id="steps"></ol>
      <aside aria-labelledby="caveat-heading" class="caveats">
        <h3 id="caveat-heading"></h3>
        <div id="caveats"></div>
      </aside>
      <button id="reset" type="button" class="reset"></button>
    </section>
    <noscript>This checker needs local JavaScript enabled to display the starting points.</noscript>
  </main>
  <footer>
    <p class="footer-label">Provided by Elec Training</p>
    <nav id="links" aria-label="Elec Training resources"></nav>
    <small>Links open in a new tab.</small>
  </footer>
</body>
</html>
