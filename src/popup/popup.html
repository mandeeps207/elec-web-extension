<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Electrician Qualification Checker</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="brand">
    <div id="brand-art"><img src="../assets/logo.png" alt="Elec Training" width="837" height="252"></div>
    <span id="review-notice" class="notice" hidden></span>
  </header>
  <main>
    <div id="introduction">
    <h1>UK Electrician<br>Qualification Checker</h1>
    <p id="intro" class="muted"></p>
    </div>
    <section id="starting-point" aria-labelledby="question">
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
    </section>
    <section id="result" aria-labelledby="result-heading" hidden>
      <p id="selected-label" class="selected"></p>
      <h1 id="result-heading" tabindex="-1"></h1>
      <p id="result-intro"></p>
      <ol id="steps"></ol>
      <aside aria-labelledby="caveat-heading" class="caveats">
        <h2 id="caveat-heading"></h2>
        <div id="caveats"></div>
      </aside>
      <button id="reset" type="button" class="reset"></button>
    </section>
    <noscript>This checker needs local JavaScript enabled to display the starting points.</noscript>
  </main>
  <footer id="resources" hidden>
    <nav id="links" aria-label="Elec Training resources"></nav>
  </footer>
</body>
</html>
