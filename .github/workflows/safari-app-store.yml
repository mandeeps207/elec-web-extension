name: Safari signed App Store build
on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: Upload build to Apple (does not submit for review)
        type: boolean
        default: false
      configuration:
        type: choice
        options: [Release]
        default: Release
      build_number:
        description: Optional positive build number; must exceed existing Apple builds
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: safari-apple-production
  cancel-in-progress: false
jobs:
  signed:
    runs-on: macos-15
    environment: apple-production
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TZ: UTC
      BUILD_OVERRIDE: ${{ inputs.build_number }}
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require reviewed Phase 1 before doing signed work
        run: node scripts/apple-ci.mjs approval
      - run: node scripts/apple-input.mjs
      - name: Recheck generated structure before accessing signing material
        run: node scripts/apple-ci.mjs diagnostic --approved
      - name: Archive and export with temporary manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_INSTALLER_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROVISION_PROFILE_BASE64 }}
          APPLE_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_EXTENSION_PROVISION_PROFILE_BASE64 }}
        run: node scripts/apple-ci.mjs signed
      - name: Optional explicit Apple upload
        if: ${{ inputs.upload_to_app_store == true }}
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          UPLOAD_AUTHORIZED: 'true'
        run: node scripts/apple-ci.mjs upload
      - name: Always clean temporary credentials
        if: always()
        run: node scripts/apple-ci.mjs cleanup
      - name: Publish allowlisted validation evidence and validated outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safari-app-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-artifacts/diagnostic/*
            build/apple-artifacts/signed/*
          if-no-files-found: warn
          retention-days: 3
