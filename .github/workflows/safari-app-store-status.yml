name: Safari App Store processing status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: macos-15
    environment: apple-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Query sanitized read-only build status
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/apple-status.mjs
      - name: Publish sanitized status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safari-app-store-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-artifacts/status/*
          if-no-files-found: error
          retention-days: 3
